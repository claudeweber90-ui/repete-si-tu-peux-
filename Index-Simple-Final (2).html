<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Répète si tu peux</title>
<style>
  body{margin:0;padding:20px;background:#fff;color:#000;font-family:system-ui,sans-serif;max-width:700px;margin:auto}
  h1{font-size:48px;font-weight:900;line-height:0.9;margin:0;text-transform:uppercase}
  .sub{font-size:20px;font-weight:700;margin:12px 0 24px}
  .card{border:4px solid #000;padding:32px;margin:20px 0;background:#fff}
  .phrase{font-size:40px;font-weight:900;line-height:1.1}
  .btn{display:block;width:100%;padding:20px;margin:12px 0;background:#000;color:#fff;border:4px solid #000;font-size:22px;font-weight:800;border-radius:12px;cursor:pointer;text-align:center}
  .btn:active{transform:scale(0.98)}
  input{width:100%;padding:16px;border:3px solid #000;font-size:20px;font-weight:700;box-sizing:border-box}
  .ok{border:4px solid #000;padding:16px;margin:16px 0;font-weight:800;background:#fff}
</style>
</head>
<body>
<h1>RÉPÈTE<br>SI TU PEUX</h1>
<p class="sub">Salut, moi c'est Cass ! Choisis un défi.</p>

<button class="btn" onclick="show('diction')">🎤 DICTION</button>
<button class="btn" onclick="show('trad')">🌍 TRADUCTION</button>
<button class="btn" onclick="show('photo')">📸 PHOTO</button>

<div id="zone" class="card" style="display:none">
  <div id="phrase" class="phrase"></div>
  <div id="hint" style="margin-top:16px;font-weight:700"></div>
  <input id="input" placeholder="Ta réponse ici" style="margin-top:16px">
  <button class="btn" onclick="check()">VÉRIFIER</button>
  <div id="result"></div>
  <button class="btn" onclick="next()" style="background:#fff;color:#000">SUIVANT →</button>
</div>

<script>
const data={
diction:["Les chaussettes de l'archiduchesse","Un chasseur sachant chasser","Si six scies scient six cyprès"],
trad:[{en:"This is my friend",fr:"cest mon ami",hint:"C'est mon ami"},{en:"Where are you going?",fr:"ou vas tu",hint:"Où vas-tu ?"},{en:"I love this game",fr:"jadore ce jeu",hint:"J'adore ce jeu"}],
photo:[{emoji:"🐱",title:"UN CHAT",desc:"Décris ce chat en 5 mots",keys:["chat","miaou"]},{emoji:"🌮",title:"UN TACOS",desc:"Décris ce plat",keys:["tacos","mexicain"]}]
};
let mode='diction', idx=0;
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');}
function show(m){mode=m;idx=0;document.getElementById('zone').style.display='block';render();}
function render(){
  const list=data[mode]; const item=list[idx%list.length];
  if(mode==='diction'){document.getElementById('phrase').textContent=item; document.getElementById('hint').textContent="→ Répète sans bégayer";}
  if(mode==='trad'){document.getElementById('phrase').textContent=item.en; document.getElementById('hint').textContent="→ Traduis: "+item.hint;}
  if(mode==='photo'){document.getElementById('phrase').textContent=item.emoji+" "+item.title; document.getElementById('hint').textContent=item.desc;}
  document.getElementById('input').value=""; document.getElementById('result').innerHTML="";
}
function check(){
  const val=document.getElementById('input').value; const n=normalize(val); let ok=false;
  const list=data[mode]; const item=list[idx%list.length];
  if(mode==='diction') ok=n.length>5;
  if(mode==='trad') ok=normalize(item.fr)===n || n.includes(normalize(item.fr));
  if(mode==='photo') ok=n.length>3;
  document.getElementById('result').innerHTML='<div class="ok">'+(ok?'✓ BRAVO !':'✗ Essaie encore')+'</div>';
}
function next(){idx++;render();}
</script>
</body>
</html>
